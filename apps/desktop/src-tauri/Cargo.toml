[package]
name = "atelier-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "atelier-desktop"

[lib]
name = "atelier_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atelier-core = { path = "../../../crates/atelier-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tiny_http = "0.12"

[dev-dependencies]
atelier-cli = { path = "../../../crates/atelier-cli" }
image.workspace = true
tempfile.workspace = true

[[bin]]
name = "konva-benchmark"
path = "src/bin/konva_benchmark.rs"

[[bin]]
name = "workspace-bridge"
path = "src/bin/workspace_bridge.rs"
